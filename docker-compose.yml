services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avn_tracker
      POSTGRES_USER: avn
      POSTGRES_PASSWORD: avn_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avn -d avn_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://avn:avn_secret@db:5432/avn_tracker?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"
    restart: on-failure

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3001:80"

volumes:
  postgres_data:
