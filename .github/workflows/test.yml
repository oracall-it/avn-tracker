name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Go unit tests ───────────────────────────────────────────────────────────
  unit-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out

  # ─── E2E tests (Playwright) ───────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests   # only run E2E if unit tests pass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Start stack with Docker Compose
        run: docker compose up --build -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for frontend..."
          timeout 120 bash -c 'until curl -sf http://localhost:3001 > /dev/null; do sleep 2; done'
          echo "Waiting for API..."
          timeout 60 bash -c 'until curl -sf http://localhost:8080 > /dev/null; do sleep 2; done'
          echo "All services ready."

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3001
          API_URL: http://localhost:8080/graphql

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose down -v
